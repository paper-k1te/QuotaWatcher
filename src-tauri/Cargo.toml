[package]
name = "quota-watcher"
version = "0.1.0"
description = "Personal Multi-Account Quota Sentinel & Auto-Failover Engine"
authors = ["QuotaWatcher Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
dirs = "5.0"
indexmap = { version = "1.9.3", features = ["std"] }
